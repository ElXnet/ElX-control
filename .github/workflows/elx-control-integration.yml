name: ElX Control integration

on:
  push:
    branches: [main]
    paths:
      - "cmd/elx-control/**"
      - "internal/elxcontrol/**"
      - "scripts/elx-*.sh"
      - "scripts/elx-*.py"
      - "tests/e2e/**"
      - "scripts/run-elx-windows.ps1"
      - "scripts/check-repository-boundary.py"
      - ".github/workflows/elx-control-integration.yml"
      - "go.mod"
      - "go.sum"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout canonical Control
        uses: actions/checkout@v5
        with:
          path: ElX-control
      - name: Checkout panel integration branch
        uses: actions/checkout@v5
        with:
          repository: ElXnet/ElX-ui
          ref: main
          path: ElX-ui
      - name: Check separation of Control and UI responsibilities
        run: python3 ElX-control/scripts/check-repository-boundary.py "$GITHUB_WORKSPACE"

  windows-launcher-syntax:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Control Windows runner
        uses: actions/checkout@v5
      - name: Parse Windows PowerShell 5.1 script without executing it
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $env:GITHUB_WORKSPACE 'scripts/run-elx-windows.ps1'),
              [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
              $errors | Format-List
              throw "Windows test launcher contains PowerShell syntax errors"
          }
      - name: Verify native stdout/stderr log capture and exit code in PowerShell 5.1
        shell: powershell
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'native-output.txt'
          'test-log-header' | Set-Content -LiteralPath $log -Encoding Unicode
          $ErrorActionPreference = 'Continue'
          & cmd.exe /d /c 'echo NATIVE_STDOUT & echo NATIVE_STDERR 1>&2 & exit /b 7' 2>&1 |
              ForEach-Object { $_.ToString() } |
              Tee-Object -FilePath $log -Append
          if ($LASTEXITCODE -ne 7) {
              throw "Native process exit code was lost by the streaming pipeline"
          }
          # The nonzero result was intentional; clear it AFTER assertion so
          # actions' PowerShell wrapper does not fail an otherwise green job.
          $global:LASTEXITCODE = 0
          $output = Get-Content -LiteralPath $log -Raw
          foreach ($item in @('test-log-header', 'NATIVE_STDOUT', 'NATIVE_STDERR')) {
              if (-not $output.Contains($item)) {
                  throw "Lost native output in log: $item"
              }
          }

  elxray-go-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout ElX-control test harness
        uses: actions/checkout@v5
        with:
          path: ElX-control
      - name: Checkout ElXray
        uses: actions/checkout@v5
        with:
          repository: ElXnet/ElXray
          ref: main
          path: ElXray
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: ElXray/go.mod
          cache: false
      - name: Validate reproducible full Go gate (fixtures + offline classification)
        run: |
          bash -n ElX-control/scripts/elxray-full-go-tests.sh
          bash ElX-control/scripts/elxray-full-go-tests.sh ElXray

  local-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: elx
          POSTGRES_PASSWORD: elx_ci_only
          POSTGRES_DB: elx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U elx -d elx_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout canonical Control
        uses: actions/checkout@v5
        with:
          path: ElX-control
      - name: Checkout ElXray integration branch
        uses: actions/checkout@v5
        with:
          repository: ElXnet/ElXray
          ref: main
          path: ElXray
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: ElX-control/go.mod
          cache: false
      - name: Print tested revisions
        run: |
          go version
          git -C ElX-control rev-parse HEAD
          git -C ElXray rev-parse HEAD
      - name: Run Control race, PostgreSQL, policy, signed-fence and VLESS suite
        working-directory: ElX-control
        env:
          ELX_CONTROL_POSTGRES_DSN: "host=127.0.0.1 port=5432 user=elx dbname=elx_test password=elx_ci_only sslmode=disable"
        run: bash scripts/elx-test-local.sh
